[workspace]
resolver = "3"
members = [
    "crates/crumbkit",
    "crates/crumbkit-derive",
    "crates/crumbkit-aliases",
    "crates/crumbkit-usage",
    "crates/crumbkit-child",
    "crates/crumbkit-markdown",
    "crates/crumbkit-test",
    "crates/cargo-crumbkit",
    "examples/shelf",
    "examples/reading",
    "examples/tutorial",
    "benches",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/crumbkit"

[workspace.dependencies]
# crumbkit re-exports the `Failure` derive of crumbkit-derive behind its
# `derive` feature (ADR-0001), and its tests use the derive. The entry gives a
# version beside the path, because cargo-deny treats a path dependency without
# a version as a wildcard (ADR-0012).
crumbkit-derive = { version = "0.0.0", path = "crates/crumbkit-derive" }
# shelf depends on the crumbkit library in this workspace, which takes a
# version beside the path for the same reason.
crumbkit = { version = "0.0.0", path = "crates/crumbkit" }
# shelf's tests check its failure codes and its command tree with
# crumbkit-test, which takes a version beside the path for the same reason.
crumbkit-test = { version = "0.0.0", path = "crates/crumbkit-test" }
# shelf expands and lists personal aliases with crumbkit-aliases, which takes
# a version beside the path for the same reason.
crumbkit-aliases = { version = "0.0.0", path = "crates/crumbkit-aliases" }
# shelf keeps a usage log with crumbkit-usage, which takes a version beside
# the path for the same reason.
crumbkit-usage = { version = "0.0.0", path = "crates/crumbkit-usage" }
# reading hands the terminal to an editor with crumbkit-child, which takes a
# version beside the path for the same reason.
crumbkit-child = { version = "0.0.0", path = "crates/crumbkit-child" }
# crumbkit-test and cargo-crumbkit write a tool's command reference with
# crumbkit-markdown, which takes a version beside the path for the same reason.
crumbkit-markdown = { version = "0.0.0", path = "crates/crumbkit-markdown" }

# clap parses the command line of every tool crumbkit serves. The workspace
# entry enables only `std`. Cargo turns on a feature for every crate in a build
# when any one crate asks for it, so a library enables only the features its own
# code needs, and each binary chooses the rest, such as colour.
clap = { version = "4.6.7", default-features = false, features = ["std"] }

# serde gives a result type its `Serialize` impl, which crumbkit reads to print
# the result as a table or as JSON. A crate enables `derive` only when its own
# code derives `Serialize`.
serde = { version = "1.0.229", default-features = false }

# serde_json writes the JSON document, and its `Value` lets the table look up a
# row's fields by their serialized names.
serde_json = { version = "1.0.151", default-features = false }

# schemars describes a result type as a JSON Schema, and the schema's
# properties are the field names that `--fields` accepts.
schemars = { version = "1.2.2", default-features = false }

# toml parses a person's aliases file in crumbkit-aliases (ADR-0027). The
# workspace entry enables no feature, and crumbkit-aliases enables only
# `parse`, which gives `toml::de::DeTable`.
toml = { version = "1.1.8", default-features = false }

# miette describes an error that points into a source, such as a file, with
# labels on byte spans of that source. crumbkit reads the labels behind its
# optional `miette` feature (ADR-0001). The entry enables no miette feature,
# because crumbkit draws the source line and its underline itself and needs
# neither the `derive` macro nor miette's graphical renderer (ADR-0003).
miette = { version = "7.6.0", default-features = false }

# unicode-width measures how many terminal columns a text takes, so the caret
# under a failure's label lines up after wide characters such as CJK text
# (ADR-0016). Only crumbkit's `miette` feature uses it. miette already
# depends on this version, so it adds no crate to the build. The entry
# leaves out the `cjk` feature, which only `width_cjk` needs.
unicode-width = { version = "0.2.2", default-features = false }

# syn, quote and proc-macro2 build crumbkit-derive, the `Failure` derive
# behind the `derive` feature (ADR-0001, ADR-0003). clap_derive already
# depends on these versions, so they add no crate to a crumbkit build. The
# entries enable no feature, and crumbkit-derive enables the ones it uses.
syn = { version = "3.0.6", default-features = false }
quote = { version = "1.0.47", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }

# is-ai-agent tells whether a coding agent runs the tool and which one, and
# gives the agent's session id when the agent sets one. crumbkit's default
# build uses it, so no picker or confirmation asks an agent a question. It
# has no features.
is-ai-agent = { version = "0.7.0", default-features = false }

# The next four crates build only with crumbkit-usage, which appends one
# line per run to a local file (ADR-0029).
#
# siphasher computes the keyed SipHash-2-4 hashes of the usage log's session
# and words. Its default `std` feature only adds `std::error::Error` impls,
# which crumbkit-usage does not use.
siphasher = { version = "1.0.4", default-features = false }

# etcetera finds the XDG base directories: the state directory of the usage
# log, and the config directory of crumbkit-aliases (ADR-0027). It has no
# features.
etcetera = { version = "0.11.0", default-features = false }

# humantime formats the time a run ended as RFC 3339 with milliseconds. Its
# one feature, `mu`, prints microseconds with the Greek letter, which
# crumbkit-usage does not use.
humantime = { version = "2.4.0", default-features = false }

# signal-hook runs the thread that writes the usage log's line when a run ends
# on SIGINT or SIGTERM, and installs the handlers that ignore SIGINT and
# SIGQUIT, or SIGINT and SIGBREAK on Windows, while a child holds the
# terminal. crumbkit-usage enables only `iterator`, which gives `Signals` on
# Unix, and crumbkit-child enables no feature.
signal-hook = { version = "0.4.5", default-features = false }

# getrandom gives the usage log's key and trace ids their random bytes on
# Windows, which has no `/dev/urandom` (ADR-0029). It needs no feature for
# `fill`. proptest already depends on it, so it adds no crate to the lock
# file.
getrandom = { version = "0.4.3", default-features = false }

# clap_complete answers a shell's completion request for crumbkit's
# optional `complete` feature (ADR-0048). Its dynamic completion needs
# `unstable-dynamic`, which clap leaves outside its semver promise, so the
# requirement allows only 4.6 patch releases. The feature brings shlex and
# is_executable and turns on clap's `unstable-ext`.
clap_complete = { version = "~4.6.11", default-features = false }

# tracing gives crumbkit's optional `tracing` feature the spans of `parse` and
# `finish`, which reach whatever subscriber the tool installs (ADR-0030). The
# entry enables no feature: the span macros need neither `std` nor
# `attributes`, and crumbkit installs no subscriber.
tracing = { version = "0.1.44", default-features = false }

# tracing-core holds `span::Current`, which a subscriber returns to say which
# span is entered and which tracing does not re-export. Only crumbkit's span
# tests use it, for their small test subscriber. tracing already depends on
# it, so it adds no crate to the build.
tracing-core = { version = "0.1.36", default-features = false }

# snapbox runs a built binary and compares its output with golden files
# (ADR-0004, ADR-0005), and crumbkit-test's help golden check and example
# check compare help pages and example output with golden files through it.
# Tests use it, and cargo-crumbkit links it through crumbkit-test.
snapbox = { version = "1.2.2", default-features = false }

# tempfile gives each of shelf's end-to-end tests its own XDG directories,
# which it removes when the test ends (ADR-0005), and cargo-crumbkit's
# `weigh` gives the binary it measures the same isolation. Its
# default `getrandom` feature seeds the directory names from the operating
# system, and without it tempfile seeds them with fastrand, which is enough
# for names that only need to differ between tests.
tempfile = { version = "3.27.0", default-features = false }

# rustix opens the pseudo-terminals of shelf's terminal test through safe
# functions, so the test needs no `unsafe` (ADR-0049), and crumbkit reads the
# width of the terminal that standard output is with it (ADR-0121). tempfile
# already brings it into the lock file, and the two add only its `pty` and
# `termios` features.
rustix = { version = "1.1.5", default-features = false }

# gungraun runs crumbkit's benchmarks under Valgrind and fails the nightly
# lane when a benchmark goes over its limit on instructions or allocations
# (ADR-0008). The version is exact, because the `gungraun-runner` binary that
# the nightly job installs must have the same version, and Dependabot leaves
# gungraun alone, so one pull request moves both and the limits together.
# gungraun exports its benchmark API only under its default feature.
gungraun = "=0.20.0"

# proptest checks the code segment rule, the predefined spellings and table
# rendering against generated inputs (ADR-0006). Only crumbkit's tests use it.
proptest = { version = "1.11.0", default-features = false }
# regex-lite matches the pattern of a checked-in schema in crumbkit-usage's
# tests, such as the pattern of a usage record's id (ADR-0079). It has no
# dependencies, and the tests need no Unicode classes or speed.
regex-lite = { version = "0.1.9", default-features = false, features = ["std", "string"] }

# Every lint warns except unsafe_code, and a build with
# CARGO_BUILD_WARNINGS=deny fails on any warning. docs/standards/README.md
# lists the rules, and ADR-0009 gives their reasons.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# A suppression uses #[expect] with a reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Code outside tests returns errors instead of panicking.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Output goes through a writer that the owning module passes in.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A module with children is foo.rs beside foo/, never foo/mod.rs.
mod_module_files = "warn"
