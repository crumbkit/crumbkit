[package]
name = "shelf"
description = "crumbkit's example tool, which browses a small catalogue of public-domain books"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# shelf is a binary, so it chooses clap's user-facing features: help, usage
# lines, error context, suggestions for mistyped commands, and colour when the
# output goes to a terminal. These are clap's default features.
clap = { workspace = true, features = [
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }
# shelf enables crumbkit's `tracing` feature, so the workspace build also
# builds crumbkit's spans (ADR-0030). shelf installs no subscriber, so its spans go nowhere. The
# `miette` feature lets the failure of a bad line in the file that
# `shelf books show --from` reads point at that line (ADR-0001). The
# `complete` feature answers a shell's completion request (ADR-0048). The
# `derive` feature writes the `Failure` impl of `BooksError` (ADR-0001).
crumbkit = { workspace = true, features = [
    "miette",
    "tracing",
    "complete",
    "derive",
] }
# `shelf books remove` keeps the ids of the removed books in shelf's XDG
# state directory, which etcetera finds as crumbkit-usage finds it.
etcetera = { workspace = true }
# shelf keeps a usage log with crumbkit-usage, which appends one line per
# run to `usage.jsonl` in shelf's XDG state directory (ADR-0029), and adds
# `self usage` and `self figures list` from it (ADR-0034).
crumbkit-usage = { workspace = true }
# shelf expands a person's aliases before parsing, and lists them with the
# hidden `shelf aliases list`.
crumbkit-aliases = { workspace = true }
# The failure of a bad line in the ids file of `shelf books show --from`
# implements `miette::Diagnostic` and holds the file as a
# `miette::NamedSource`, which need no miette feature.
miette = { workspace = true }
# shelf derives `Serialize` and `JsonSchema` for its results.
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"] }

[dev-dependencies]
# shelf's tests check its failure codes and its command tree with
# crumbkit-test.
crumbkit-test = { workspace = true }
# `cmd` runs the built shelf binary in the end-to-end tests.
snapbox = { workspace = true, features = ["cmd"] }
# The usage log tests read each line of the log as JSON.
serde_json = { workspace = true }
# Each end-to-end test runs shelf with XDG directories in a temporary
# directory of its own, which tempfile removes when the test ends.
tempfile = { workspace = true }

# The terminal test runs shelf's examples on pseudo-terminals, which rustix
# opens on macOS and Linux (ADR-0049).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { workspace = true, features = ["std", "fs", "pty", "termios"] }

[lints]
workspace = true
