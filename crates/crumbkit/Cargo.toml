[package]
name = "crumbkit"
description = "Conventions for clap command-line tools that people and agents can drill into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "clap", "agents", "help", "errors"]
categories = ["command-line-interface"]
include = ["src/**/*.rs", "schemas/*.json", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# `Output` and `Page` derive `clap::Args`. `Page` gives `--limit` a default
# that it formats at runtime from its const parameter, and clap accepts a
# default held in an owned `String` only with its `string` feature.
# `help::extend` sets a help template, which clap offers only with its `help`
# feature. Without `help`, clap also leaves out `-h` and `--help`, which
# crumbkit's refusals tell the caller to run (ADR-0003).
clap = { workspace = true, features = ["derive", "string", "help"] }
# crumbkit implements `Serialize` by hand, so it needs no serde feature.
serde = { workspace = true }
# `std` gives `to_writer` over an `io::Write`, and serde_json needs `std` or
# `alloc` to build at all.
serde_json = { workspace = true, features = ["std"] }
# `schema_for!`, `json_schema!` and the `JsonSchema` trait need no schemars
# feature.
schemars = { workspace = true }
# The `miette` feature reads a failure's labels through `miette::Diagnostic`
# and converts a `miette::Report` into `Error` (ADR-0001). crumbkit needs no
# miette feature.
miette = { workspace = true, optional = true }

[features]
# `miette` is off by default, so the default build has no miette code and no
# miette dependency (ADR-0003).
miette = ["dep:miette"]

[dev-dependencies]
# The tests compare the exact help pages and refusal messages that a tool
# built with clap's default features prints. The normal dependency already
# enables `help`, and these add the other default features that change help
# pages and refusals. They change only the test build, so a tool still
# chooses its own clap features.
clap = { workspace = true, features = ["usage", "error-context", "suggestions"] }
# The tests and the README example derive `Serialize` and `JsonSchema` for
# their rows.
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"] }
# `std` builds proptest on the standard library and gives the strategies that
# generate strings from a regular expression. The default features add
# forking, timeouts and bit-set strategies, which the tests do not use.
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
