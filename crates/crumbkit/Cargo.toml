[package]
name = "crumbkit"
description = "Conventions for clap command-line tools that people and agents can drill into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "clap", "agents", "help", "errors"]
categories = ["command-line-interface"]
include = ["src/**/*.rs", "schemas/*.json", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# crumbkit re-exports every item of crumbkit-core at the path the item had in
# crumbkit, so a tool adds only crumbkit (ADR-0032).
crumbkit-core = { workspace = true }
# `Output` and `Page` derive `clap::Args`. `Page` gives `--limit` a default
# that it formats at runtime from its const parameter, and clap accepts a
# default held in an owned `String` only with its `string` feature.
# `help::extend` sets a help template, which clap offers only with its `help`
# feature. Without `help`, clap also leaves out `-h` and `--help`, which
# crumbkit's refusals tell the caller to run (ADR-0003). A refusal reads the
# argument and value that clap refused through `Error::get`, which clap
# offers only with its `error-context` feature (ADR-0003).
clap = { workspace = true, features = ["derive", "string", "help", "error-context"] }
# crumbkit implements `Serialize` by hand, so it needs no serde feature.
serde = { workspace = true }
# `std` gives `to_writer` over an `io::Write`, and serde_json needs `std` or
# `alloc` to build at all.
serde_json = { workspace = true, features = ["std"] }
# `schema_for!`, `json_schema!` and the `JsonSchema` trait need no schemars
# feature.
schemars = { workspace = true }
# The `miette` feature reads a failure's labels through `miette::Diagnostic`
# and converts a `miette::Report` into `Error` (ADR-0001). crumbkit needs no
# miette feature.
miette = { workspace = true, optional = true }
# The `miette` feature measures the text before and under a label with
# unicode-width, so the caret underline lines up after wide characters
# (ADR-0016). miette already depends on it.
unicode-width = { workspace = true, optional = true }
# is-ai-agent tells whether a coding agent runs the tool, so neither a
# picker nor `Output::confirm` asks it a question (ADR-0043). It has no
# dependencies.
is-ai-agent = { workspace = true }
# signal-hook gives `child` the handlers that keep the tool running while a
# child holds the terminal (ADR-0042). `child` needs only `flag`, which
# every build of signal-hook has.
signal-hook = { workspace = true, optional = true }
# The `tracing` feature puts `parse` and `finish` in spans of the tracing
# crate (ADR-0030). crumbkit needs no tracing feature.
tracing = { workspace = true, optional = true }

# The `complete` feature answers a shell's completion request through
# clap_complete's dynamic completion, which needs its `unstable-dynamic`
# feature (ADR-0048).
clap_complete = { workspace = true, optional = true, features = ["unstable-dynamic"] }

[features]
# `miette` is off by default, so the default build has no miette code and no
# miette dependency (ADR-0003). It turns on crumbkit-core's `miette` feature,
# which adds `Failure::diagnostic`, and adds unicode-width for the caret
# underline.
miette = ["dep:miette", "dep:unicode-width", "crumbkit-core/miette"]
# `hand-over` is off by default, so the default build has no `child` module
# and no signal-hook (ADR-0003, ADR-0042). serde's `DeserializeOwned`, which
# reads a child's JSON, needs no serde feature.
hand-over = ["dep:signal-hook"]
# `tracing` is off by default, so the default build has no span code and no
# tracing dependency (ADR-0003, ADR-0030).
tracing = ["dep:tracing"]
# `complete` is off by default, so the default build has no completion code
# and no clap_complete (ADR-0003, ADR-0048). It follows clap_complete's
# unstable dynamic completion, so a crumbkit minor release may change it
# (ADR-0002).
complete = ["dep:clap_complete"]
# `derive` is off by default, so a tool that writes its `Failure` impls by
# hand builds no syn (ADR-0003). It turns on crumbkit-core's `derive`
# feature, which adds `#[derive(Failure)]` at `crumbkit::Failure`.
derive = ["crumbkit-core/derive"]

[dev-dependencies]
# The tests compare the exact help pages and refusal messages that a tool
# built with clap's default features prints. The normal dependency already
# enables `help` and `error-context`, and these add the other default
# features that change help pages and refusals. They change only the test
# build, so a tool still chooses its own clap features.
clap = { workspace = true, features = ["usage", "suggestions"] }
# The tests and the README example derive `Serialize` and `JsonSchema` for
# their rows.
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"] }
# `std` builds proptest on the standard library and gives the strategies that
# generate strings from a regular expression. The default features add
# forking, timeouts and bit-set strategies, which the tests do not use.
proptest = { workspace = true, features = ["std"] }
# The example in the `trace` module's docs opens a span with
# `tracing::info_span!`, and its doctest also builds without the `tracing`
# feature. The span tests install their test subscriber with
# `tracing::subscriber::set_global_default`, which needs no tracing feature.
tracing = { workspace = true }
# The test subscriber names the entered span with `tracing_core::span::Current`.
tracing-core = { workspace = true }

# docs.rs documents the crate with every feature on. `--cfg docsrs` turns on
# the `doc_cfg` attribute in `lib.rs`, which labels each item behind a feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
