[package]
name = "crumbkit-child"
description = "Hands the terminal to another program, such as an editor or a pager, as a crumbkit command's whole response"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "clap", "terminal", "process"]
categories = ["command-line-interface"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# The hand-over prints its failures and refusals through crumbkit's `Output`
# and `Sink`, and tells crumbkit's run observer that a child took the
# terminal (ADR-0042, ADR-0057). `derive` writes the `Failure` impl of the
# child's error from its `#[failure(...)]` attributes.
crumbkit = { workspace = true, features = ["derive"] }
# signal-hook installs the handlers that keep the tool running while a child
# holds the terminal (ADR-0042). The crate needs only `flag`, which every
# build of signal-hook has.
signal-hook = { workspace = true }

[dev-dependencies]
# The tests parse the output flags into an `Output` with `clap::Parser`.
clap = { workspace = true, features = ["derive"] }
# The tests read the failure document that a refused `--json` prints.
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
