[package]
name = "crumbkit-test"
description = "Tests that check a crumbkit tool's failure codes, command tree, guide, help pages and examples against the crumbkit conventions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "clap", "agents", "testing"]
categories = ["command-line-interface", "development-tools::testing"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# The codes check takes crumbkit's `Code` and `Spelling`, and spells each code
# as the tool's `finish` prints it.
crumbkit = { workspace = true }
# The command reference check renders a tool's `commands list` document with
# crumbkit-markdown, which `cargo crumbkit docs` also calls, so the two write
# the same file (ADR-0044).
crumbkit-markdown = { workspace = true }
# The command tree checks read a tool's `clap::Command` through clap's public
# getters, which need no clap feature beyond the workspace's `std`.
clap = { workspace = true }
# The help golden check and the example check compare each help page and
# each example's output with its golden file and rewrite the file with
# `SNAPSHOTS=overwrite`, as shelf's other golden files do (ADR-0004). The
# example check runs the tool's binary through snapbox's `cmd` module, which
# captures standard output and standard error. The `cmd` feature gives each
# run a timeout, so the check stops an example that never ends, such as a
# stream that follows its input. Its crates were already in the build through
# the examples' tests. Without `diff`, a mismatch shows the expected and the
# actual text in full.
snapbox = { workspace = true, features = ["cmd"] }
# The schema golden check writes each document's JSON Schema as
# pretty-printed JSON, as crumbkit's checked-in schema files hold it.
# serde_json needs `std` or `alloc` to build at all.
serde_json = { workspace = true, features = ["std"] }
# The opt-out report derives `Serialize` for its entries, so the JSON report
# keeps its fields in the order a reader expects: the schema id first. The
# guide check's tests also give leaves row types that derive `Serialize`.
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# The guide check's tests give leaves row types, which derive `JsonSchema`.
schemars = { workspace = true, features = ["derive"] }
# The tests of the recovery check's command-line reading generate words with
# proptest and check that the reading returns each word that `help::quote`
# wrote. `std` gives the strategies that generate strings from a regular
# expression. The default features add forking, timeouts and bit-set
# strategies, which the tests do not use.
proptest = { workspace = true, features = ["std"] }

# docs.rs documents the crate with every feature on. `--cfg docsrs` turns on
# the `doc_cfg` attribute in `lib.rs`, which labels each item behind a feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
