[package]
name = "cargo-crumbkit"
description = "Cargo subcommand that measures what each path through a crumbkit tool's help costs an agent to read, and writes its command reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "clap", "agents", "help", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
include = ["src/**/*.rs", "schemas/*.json", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# cargo-crumbkit is a crumbkit tool: it parses with `crumbkit::parse`,
# prints through `finish`, and mounts crumbkit's `commands list`. `derive`
# writes the `Failure` impls of its errors from their `#[failure(...)]`
# attributes.
crumbkit = { workspace = true, features = ["derive"] }
# cargo-crumbkit is a binary, so it chooses clap's user-facing features, as
# shelf does: help, usage lines, error context, suggestions for mistyped
# commands, and colour when the output goes to a terminal.
clap = { workspace = true, features = [
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }
# `weigh` sums path totals and reads output weights with crumbkit-test's
# `path_totals` and `output_weight`, which its `check_path_weights` uses, and
# finds each golden file by the name that `check_examples` writes it under,
# so weigh and the check cannot disagree.
crumbkit-test = { workspace = true }
# `docs` renders the tool's `commands list` document with crumbkit-markdown,
# which crumbkit-test's `check_command_reference` also calls, so the file that
# `docs` writes is the file that the check expects (ADR-0044).
crumbkit-markdown = { workspace = true }
# `weigh --usage` finds the tool's own usage log through crumbkit-usage's
# `log_path`, which names the file that crumbkit-usage writes (ADR-0029), so
# the two find the same file. `weigh` also recognises the
# `self-figures-list/v1` document by crumbkit-usage's `SELF_FIGURES_LIST`.
crumbkit-usage = { workspace = true }
# The weight row derives `Serialize` and `JsonSchema`, as a tool's results do.
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"] }
# `weigh` reads cargo's JSON build messages and the tool's
# `commands list --json --full` document. `std` reads them from bytes.
serde_json = { workspace = true, features = ["std"] }
# `weigh` runs the tool's binary with XDG directories in a fresh temporary
# directory, which tempfile removes when the run ends, so a run never reads
# or writes the person's own configuration or usage log.
tempfile = { workspace = true }

[lints]
workspace = true
