[package]
name = "crumbkit-durable"
description = "Replace a file atomically, so a reader or a crash sees the old bytes or the new bytes, and lock a lock file that is still at its path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["atomic", "file", "write", "fsync", "lock"]
categories = ["filesystem"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

# The crate depends on no other crumbkit crate, so any tool, including one
# that does not use crumbkit, can replace and lock its files through it
# (ADR-0221).

# rustix names `O_NOFOLLOW` and `O_NONBLOCK`, which the open of a lock file
# passes to std on Unix, because std names no open flag. For a tool outside
# the crumbkit workspace, rustix is a new dependency on Unix.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Each test writes into a temporary directory of its own, which tempfile
# removes when the test ends.
tempfile = { workspace = true }

[lints]
workspace = true
