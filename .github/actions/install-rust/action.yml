# The lint and test jobs of ci.yml and the nightly job of scheduled.yml use this
# action after actions/checkout (ADR-0011).
name: Install Rust
description: Installs rustup and the toolchain that rust-toolchain.toml pins.

runs:
  using: composite
  steps:
    # The ubuntu-slim image has no rustup, so this installs it with the
    # official installer and no toolchain. zizmor's github-env audit flags any
    # write to GITHUB_PATH in an action, because it cannot see the caller's
    # triggers. This step writes a fixed directory, and no caller runs on a
    # trigger that hands control to another repository's code.
    - shell: bash
      run: | # zizmor: ignore[github-env]
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    # rustup installs the toolchain that rust-toolchain.toml pins in the
    # checked-out repository.
    - shell: bash
      run: rustup toolchain install
