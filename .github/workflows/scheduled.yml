# The scheduled lane of ADR-0011. The nightly job checks for new advisories,
# measures the pull-request lane and builds the docs as docs.rs does. The bench
# job checks the benchmarks and shelf's run time against their limits
# (ADR-0008) when main has changed since they last passed. The windows job
# builds, lints and tests the workspace on Windows (CI-4) when main has
# changed since it last passed. The clap-latest job tests crumbkit and shelf
# against the newest clap release that Cargo.toml allows. The report job
# keeps every failure on one issue and names each job that failed. A manual
# run runs every job in full.
name: Scheduled

on:
  schedule:
    - cron: "23 3 * * *" # Nightly at 03:23 UTC.
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

env:
  # Any compiler or clippy warning fails the build (ADR-0009).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  # The bench job runs the benchmarks of PERF-1 and the run time check of
  # PERF-2. It runs on a pinned image, so the counts stay comparable from
  # night to night, and it has no rust-cache, as the nightly job has none.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # The first step reads the earlier runs of this workflow.
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A scheduled run skips the checks when the newest completed run of
      # this workflow on main whose bench job passed ran at the same commit,
      # because nothing they measure has changed. A failed or missing earlier
      # run, or a manual run, runs them. The script reads only the ten newest
      # completed runs, so after ten runs without a passing bench job the
      # checks run.
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          last=$(.github/scripts/last-passed.sh bench)
          if [ "$EVENT" = schedule ] && [ "$last" = "$SHA" ]; then
            echo "The bench job last passed at $SHA, so this run skips its checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install
      # gungraun runs each benchmark under Valgrind, which the image lacks.
      - if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      # The runner's version must equal the gungraun version in Cargo.toml.
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: gungraun-runner@0.20.0
          fallback: none
      - if: steps.changed.outputs.run == 'true'
        run: cargo bench -p crumbkit-benches
      # The run time check runs even when a benchmark fails, so one failure
      # does not hide the other.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: cargo xtask run-time
      - if: ${{ always() }}
        run: |
          mkdir -p out/head
          for b in root_help refusal; do
            f=target/gungraun/crumbkit-benches/runs/runs/run.$b/callgrind.run.$b.out
            callgrind_annotate --inclusive=yes --threshold=100 "$f" > out/head/$b.incl.txt || true
            callgrind_annotate --tree=calling --inclusive=yes --threshold=100 "$f" > out/head/$b.tree.txt || true
          done
      - if: ${{ always() }}
        run: |
          git checkout db7f1f07 -- crates examples Cargo.toml Cargo.lock
          cargo bench -p crumbkit-benches || true
          mkdir -p out/old
          for b in root_help refusal; do
            f=target/gungraun/crumbkit-benches/runs/runs/run.$b/callgrind.run.$b.out
            callgrind_annotate --inclusive=yes --threshold=100 "$f" > out/old/$b.incl.txt || true
            callgrind_annotate --tree=calling --inclusive=yes --threshold=100 "$f" > out/old/$b.tree.txt || true
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: profile
          path: out
