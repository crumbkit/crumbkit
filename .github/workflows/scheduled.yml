# The scheduled lane of ADR-0011. The nightly job checks for new advisories,
# measures the pull-request lane and builds the docs as docs.rs does. The bench
# job checks the benchmarks and shelf's run time against their limits
# (ADR-0008) when main has changed since they last passed. The windows job
# builds, lints and tests the workspace on Windows (CI-4) when main has
# changed since it last passed. The report job keeps every failure on one
# issue. A manual run runs every job in full.
name: Scheduled

on:
  schedule:
    - cron: "23 3 * * *" # Nightly at 03:23 UTC.
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

env:
  # Any compiler or clippy warning fails the build (ADR-0009).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  # This job has no rust-cache, because little in it compiles, and rust-cache
  # keys include the job ID, so its cache would not help the pull-request jobs.
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # cargo xtask ci-time reads the runs of ci.yml.
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image includes rustup, which installs the toolchain that
      # rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
          fallback: none
      - run: cargo deny check advisories
      # The CI time check runs even when the advisories check fails, so one
      # failure does not hide the other.
      - if: ${{ !cancelled() }}
        run: cargo xtask ci-time
        env:
          GH_TOKEN: ${{ github.token }}
      # docs.rs builds each published crate's docs on nightly with every
      # feature and `--cfg docsrs`, as each crate's
      # `[package.metadata.docs.rs]` asks, so this build shows a docs.rs
      # failure before a release does. It runs even when an earlier check
      # failed, and it writes to a target directory of its own, apart from
      # the stable builds.
      - if: ${{ !cancelled() }}
        run: rustup toolchain install nightly --profile minimal
      - if: ${{ !cancelled() }}
        run: >-
          cargo +nightly doc --workspace --no-deps --all-features
          --exclude shelf --exclude xtask
        env:
          CARGO_TARGET_DIR: target/docs-rs
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # The bench job runs the benchmarks of PERF-1 and the run time check of
  # PERF-2. It runs on a pinned image, so the counts stay comparable from
  # night to night, and it has no rust-cache, as the nightly job has none.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # The first step reads the earlier runs of this workflow.
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A scheduled run skips the checks when the newest completed run of
      # this workflow on main whose bench job passed ran at the same commit,
      # because nothing they measure has changed. A failed or missing earlier
      # run, or a manual run, runs them. The script reads only the ten newest
      # completed runs, so after ten runs without a passing bench job the
      # checks run.
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          last=$(.github/scripts/last-passed.sh bench)
          if [ "$EVENT" = schedule ] && [ "$last" = "$SHA" ]; then
            echo "The bench job last passed at $SHA, so this run skips its checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install
      # gungraun runs each benchmark under Valgrind, which the image lacks.
      - if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      # The runner's version must equal the gungraun version in Cargo.toml.
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: gungraun-runner@0.20.0
          fallback: none
      - if: steps.changed.outputs.run == 'true'
        run: cargo bench -p crumbkit-benches
      # The run time check runs even when a benchmark fails, so one failure
      # does not hide the other.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: cargo xtask run-time

  # The changed job tells the windows job whether main has changed since the
  # windows job last passed, as the bench job's first step does for itself.
  # It uses the gh CLI that the ubuntu-slim image includes.
  changed:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read # The script reads the earlier runs of this workflow.
      contents: read # actions/checkout reads the repository.
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          last=$(.github/scripts/last-passed.sh windows)
          if [ "$EVENT" = schedule ] && [ "$last" = "$SHA" ]; then
            echo "The windows job last passed at $SHA, so this run skips it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The windows job builds, lints and tests the workspace on Windows, which
  # is crumbkit's tier-2 platform (ADR-0003, CI-4). A failure here opens or
  # comments on the scheduled issue and blocks no release. It has no
  # rust-cache, as the nightly job has none, and it turns off debug info and
  # incremental builds, which the job would only write and never read.
  windows:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read # actions/checkout reads the repository.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image includes rustup, which installs the toolchain that
      # rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - run: cargo clippy --workspace --all-targets
      # Each later step runs even when an earlier one fails, so one failure
      # does not hide another.
      - if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --profile ci
      - if: ${{ !cancelled() }}
        run: cargo test --workspace --doc

  # When the nightly, bench, changed or windows job fails, this job comments on the open issue
  # titled "Scheduled CI failed", or opens that issue when none is open, so
  # failures collect in one place. It uses the gh CLI that the ubuntu-slim image
  # includes.
  report:
    needs: [nightly, bench, changed, windows]
    if: failure()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      issues: write # gh comments on the issue or opens it.
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled CI failed
        run: |
          number=$(gh issue list --state open --search "in:title $TITLE" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "This scheduled run failed: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "This scheduled run failed: $RUN_URL"
          fi
