# The pull-request lane of ADR-0011. The lint and test jobs run in parallel
# and report on their own.
name: CI

on:
  pull_request:
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Any compiler or clippy warning fails the build (ADR-0009).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the private repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ubuntu-slim image has no rustup, so this installs it with the
      # official installer and no toolchain.
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # rustup installs the toolchain that rust-toolchain.toml pins. It runs
      # before rust-cache, which reads the rustc version for its cache key.
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor,cargo-deny,cargo-shear
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      # shelf turns on crumbkit's `usage-log` and `tracing` features, so the
      # workspace run checks crumbkit with both. clippy checks crumbkit on its
      # own in the default build, with `miette`, and with `tracing` alone,
      # because a single `--all-features` run would miss a warning that only
      # one build shows, such as an import that only one feature uses. The
      # `tracing` build compiles the spans without the usage log's ids, which
      # no other build compiles.
      - run: cargo clippy -p crumbkit --all-targets
      - run: cargo clippy -p crumbkit --all-targets --features miette
      - run: cargo clippy -p crumbkit --all-targets --features tracing
      - run: cargo xtask check
      # The advisories check runs nightly in scheduled.yml, because a new
      # advisory can appear when no code has changed (ADR-0012).
      - run: cargo deny check bans licenses sources
      - run: cargo shear
      # zizmor lints the workflows and .github/dependabot.yml.
      - run: zizmor .

  test:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the private repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ubuntu-slim image has no rustup, so this installs it with the
      # official installer and no toolchain.
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # rustup installs the toolchain that rust-toolchain.toml pins. It runs
      # before rust-cache, which reads the rustc version for its cache key.
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so cargo test runs them.
      - run: cargo test --workspace --doc
      # shelf turns on crumbkit's `usage-log` feature, so the workspace runs
      # test crumbkit with that feature. crumbkit's tests and doctests run
      # again on their own in the default build and with `miette`.
      - run: cargo nextest run -p crumbkit --profile ci
      - run: cargo test -p crumbkit --doc
      - run: cargo nextest run -p crumbkit --features miette --profile ci
      - run: cargo test -p crumbkit --features miette --doc
      # The MSRV check builds with the oldest supported toolchain (RUST-9).
      # It builds with every feature, which compiles every line of code once,
      # because no code is left out when a feature is on.
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --workspace --all-targets --all-features
