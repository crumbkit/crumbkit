# The fast lane of ADR-0011. The lint and test jobs run in parallel, and the
# gate job reports whether both passed. A push to main runs them again on the
# merged code, and also runs the tests on macOS.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A new push to a pull request, or to main, cancels the run for the previous
# push, because the newer run tests the same changes and more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Any compiler or clippy warning fails the build (ADR-0009).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      # The full history includes every commit of a pull request, which the
      # commit check reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The commit check fails a pull request when one of its commits matches
      # the COMMIT_PATTERN secret, and passes with a notice when the secret is
      # empty, as in a pull request from a fork (ADR-0011).
      - if: github.event_name == 'pull_request'
        env:
          COMMIT_PATTERN: ${{ secrets.COMMIT_PATTERN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/commit-check.sh "$BASE_SHA" "$HEAD_SHA"
      # The image includes rustup, which installs the toolchain that
      # rust-toolchain.toml pins and the MSRV toolchain. Both install before
      # rust-cache, which reads the installed rustc versions for its cache key.
      - run: rustup toolchain install
      - run: rustup toolchain install 1.89.0 --profile minimal
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor,cargo-deny,cargo-shear
          fallback: none
      # Only a run on main saves the cache. A pull request restores the cache
      # that main saved and saves none of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      # shelf turns on crumbkit's `miette`, `usage-log` and `tracing` features,
      # and reading turns on `hand-over`, so the workspace run checks crumbkit
      # with all four. clippy checks crumbkit on its own in the default build,
      # with `miette`, with `tracing` alone and with `hand-over` alone, because
      # a single `--all-features` run would miss a warning that only one build
      # shows, such as an import that only one feature uses. The `tracing`
      # build compiles the spans without the usage log's ids, and the
      # `hand-over` build compiles the SIGINT handler that the usage log
      # otherwise replaces, which no other build compiles.
      - run: cargo clippy -p crumbkit --all-targets
      - run: cargo clippy -p crumbkit --all-targets --features miette
      - run: cargo clippy -p crumbkit --all-targets --features tracing
      - run: cargo clippy -p crumbkit --all-targets --features hand-over
      # The MSRV check builds with the oldest supported toolchain (RUST-9).
      # It builds with every feature, which compiles every line of code once,
      # because no code is left out when a feature is on.
      - run: cargo +1.89.0 check --workspace --all-targets --all-features
      - run: cargo xtask check
      # rustdoc fails on a warning, such as a broken link (DOCS-4). The
      # workspace run documents crumbkit with the features that shelf turns
      # on, and the crumbkit run documents its default build, where a link to
      # an item behind a feature breaks.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p crumbkit --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The advisories check runs nightly in scheduled.yml, because a new
      # advisory can appear when no code has changed (ADR-0012).
      - run: cargo deny check bans licenses sources
      - run: cargo shear
      # zizmor lints the workflows and .github/dependabot.yml.
      - run: zizmor .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image includes rustup, which installs the toolchain that
      # rust-toolchain.toml pins. It runs before rust-cache, which reads the
      # rustc version for its cache key.
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      # Only a run on main saves the cache. A pull request restores the cache
      # that main saved and saves none of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so cargo test runs them.
      - run: cargo test --workspace --doc
      # shelf turns on crumbkit's `miette`, `usage-log` and `tracing` features,
      # and reading turns on `hand-over`, so the workspace runs test crumbkit
      # with all four. crumbkit's tests and doctests run again on their own in
      # the default build and with `miette`, and its tests run with
      # `hand-over` alone, which hands the terminal to a child without the
      # usage log's signal thread.
      - run: cargo nextest run -p crumbkit --profile ci
      - run: cargo test -p crumbkit --doc
      - run: cargo nextest run -p crumbkit --features miette --profile ci
      - run: cargo test -p crumbkit --features miette --doc
      - run: cargo nextest run -p crumbkit --features hand-over --profile ci

  # The repository ruleset requires this one check, so a job that joins the
  # fast lane joins this job's `needs` and the ruleset stays the same. The job
  # runs even when a needed job failed or was cancelled, and it fails unless
  # every needed job succeeded. A skipped job fails it too, because a skipped
  # job ran none of its checks.
  gate:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "The fast-lane jobs finished with these results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  # The macOS tests run on each push to main and stay out of the pull-request
  # lane and the gate, so a pull request never waits for a macOS runner.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image includes rustup, which installs the toolchain that
      # rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      # Only a run on main saves the cache, and the next push to main
      # restores it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so cargo test runs them.
      - run: cargo test --workspace --doc
