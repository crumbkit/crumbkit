# Dependabot proposes dependency updates (ADR-0012). Each ecosystem checks
# once a week and puts all its version updates in one pull request, so each
# week costs at most one CI run per ecosystem. The 7-day cooldown proposes a
# release only once it is 7 days old, which gives the ecosystem time to find
# and yank a compromised release before it reaches crumbkit.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    # gungraun's version must match the gungraun-runner binary that the
    # nightly bench job installs, and a new version can change the counts
    # that the benchmark limits hold (ADR-0008). One hand-written pull
    # request moves the crate, the runner and the limits together.
    ignore:
      - dependency-name: gungraun
      # miette 7.6 depends on unicode-width 0.1, and a crumbkit dependency on
      # 0.2 puts a second copy in the build, which clippy's
      # multiple-crate-versions lint rejects. The rule ignores 0.2 and later,
      # which Cargo treats as breaking updates of 0.1, and still proposes
      # 0.1 releases. Drop it when the miette that crumbkit uses depends on
      # unicode-width 0.2 or later.
      - dependency-name: unicode-width
        versions: [">= 0.2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
