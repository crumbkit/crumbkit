# cargo-deny checks the dependency graph (ADR-0012, CI-2). The pull-request
# lint job runs the bans, licenses and sources checks, and the nightly job in
# scheduled.yml runs the advisories check. A setting that is cargo-deny's
# default is left out.

[graph]
# The checks also cover dependencies behind optional cargo features, such as
# the usage-log feature of ADR-0003, which a default build would leave out.
all-features = true

[advisories]
# A yanked version fails the check, because its author withdrew it, usually
# for a bug, and Dependabot proposes the replacement.
yanked = "deny"
# An unsound advisory fails the check for every crate in the graph, because
# unsound code in a transitive dependency still runs in an adopter's build.
unsound = "all"

[licenses]
# These are the licences the dependency graph uses. crumbkit itself is
# MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "MIT",
    # unicode-ident includes Unicode's character data, which is under the
    # Unicode-3.0 licence.
    "Unicode-3.0",
]
# A licence that no dependency uses any more fails the check, so the allow
# list stays exactly the licences in use.
unused-allowed-license = "deny"

[bans]
# Two versions of one crate fail the check, because each copy adds compile
# time and weight (ADR-0003). A duplicate that cannot be removed yet goes in
# `skip` with a reason.
multiple-versions = "deny"
# Duplicates among dev-dependencies fail the check too, because CI compiles
# them on every run.
multiple-versions-include-dev = true
# A `*` version requirement fails the check, because cargo may resolve it to
# any version, and crates.io refuses to publish a crate that has one.
wildcards = "deny"
# ADR-0003 rules out an async runtime and a C build, and ADR-0032 rules out
# clap in crumbkit-core.
deny = [
    { crate = "tokio", reason = "ADR-0003 rules out an async runtime" },
    { crate = "async-std", reason = "ADR-0003 rules out an async runtime" },
    { crate = "smol", reason = "ADR-0003 rules out an async runtime" },
    { crate = "cc", reason = "ADR-0003 rules out a C build" },
    { crate = "cmake", reason = "ADR-0003 rules out a C build" },
    # Only the crates in `wrappers` may depend on clap directly, so the check
    # fails when clap enters crumbkit-core's dependency tree (ADR-0032).
    # clap_builder holds clap's parser, and a crate could depend on it without
    # clap, so only clap itself may depend on it. A new crate that parses a
    # command line joins the clap list.
    { crate = "clap", wrappers = [
        "cargo-crumbkit",
        "crumbkit",
        "crumbkit-aliases",
        "crumbkit-test",
        "reading",
        "shelf",
        "xtask",
    ], reason = "ADR-0032 keeps clap out of crumbkit-core" },
    { crate = "clap_builder", wrappers = [
        "clap",
    ], reason = "ADR-0032 keeps clap out of crumbkit-core" },
]
# gungraun, which only the benchmarks use (ADR-0008), reaches syn 2 through
# derive_more, while the rest of the graph uses syn 3. The skip lasts until
# derive_more moves to syn 3, and it names the exact version, so another syn 2
# release still fails the check.
skip = [
    { crate = "syn@2.0.119", reason = "derive_more, which gungraun uses, still depends on syn 2" },
]

# A direct dependency on a crate whose function the standard library provides
# at the workspace rust-version fails the check. The empty table enables the
# check with its defaults, which cover only the crates that workspace members
# depend on directly, because crumbkit cannot change its dependencies' choices.
[bans.std-replacements]

# The build check scans every crate that runs at compile time, which means
# build scripts and procedural macros such as clap_derive. A native executable
# in such a crate fails the check by default.
[bans.build]
# A script with a shebang line fails the check, because a build script could
# run it.
interpreted = "deny"
# Files with the extensions of common script languages, such as Python, fail
# the check even without a shebang line.
enable-builtin-globs = true
# The scan also covers the dependencies of compile-time crates, such as syn,
# because they run inside the compiler too. cargo-deny counts every dependency
# of such a crate, of any kind, so shelf's build script brings shelf's whole
# dependency graph into the scan, including crumbkit's dev-dependencies.
include-dependencies = true

[sources]
# Every crate comes from crates.io, which is the default allowed registry. A
# crate from any other registry or from a git repository fails the check.
unknown-registry = "deny"
unknown-git = "deny"

# proptest, which only crumbkit's tests use, brings two crates whose published
# sources hold scripts that the build check rejects: proptest itself, and
# zerocopy, which proptest reaches through rand_chacha and ppv-lite86. The
# scripts are their authors' test, CI and release helpers, and no build runs
# them: proptest has no build script, and zerocopy's build script is Rust that
# asks rustc for its version. Each entry allows only the paths of those
# scripts, so a script elsewhere in either crate still fails the check.
[[bans.build.bypass]]
crate = "proptest"
allow-globs = ["test-persistence-location/run-tests.*"]

[[bans.build.bypass]]
crate = "zerocopy"
allow-globs = ["cargo.sh", "win-cargo.bat", "ci/*.sh"]

# miette, which crumbkit's optional `miette` feature brings, depends on
# unicode-width, whose published sources hold `scripts/unicode.py`. The script
# regenerates unicode-width's Unicode tables from Unicode's data files, and no
# build runs it: unicode-width sets `build = false`. The entry allows only that
# path, so a script elsewhere in the crate still fails the check.
[[bans.build.bypass]]
crate = "unicode-width"
allow-globs = ["scripts/unicode.py"]

# tracing, which crumbkit's optional `tracing` feature brings (ADR-0030), is in
# the scan because shelf depends on it through crumbkit. tracing's published
# sources hold `test-macros/bin/macro-results.sh`, which its authors use to
# compare the output of its macro tests, and no build runs it: tracing sets
# `build = false` and has no procedural macro. The entry allows only that
# path, so a script elsewhere in the crate still fails the check.
[[bans.build.bypass]]
crate = "tracing"
allow-globs = ["test-macros/bin/macro-results.sh"]
